name: Momok macOS Release

on:
  push:
    tags:
      - "momok-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Show tool versions
        run: |
          xcodebuild -version
          zig version

      - name: Build universal Release app
        env:
          MOMOK_VERSION: ${{ startsWith(github.ref, 'refs/tags/momok-v') && github.ref_name || 'momok-dev' }}
        run: zig build -Doptimize=ReleaseFast -Dversion-string="${MOMOK_VERSION#momok-v}"

      - name: Apply ad-hoc signature
        run: codesign --force --deep --sign - macos/build/ReleaseLocal/Momok.app

      - name: Verify app bundle
        run: |
          codesign --verify --deep --strict --verbose=2 macos/build/ReleaseLocal/Momok.app
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' macos/build/ReleaseLocal/Momok.app/Contents/Info.plist)" = "com.andiahmads.momok"
          file macos/build/ReleaseLocal/Momok.app/Contents/MacOS/ghostty

      - name: Package app and checksum
        run: |
          ditto -c -k --sequesterRsrc --keepParent macos/build/ReleaseLocal/Momok.app Momok-macOS-universal.zip
          shasum -a 256 Momok-macOS-universal.zip > Momok-macOS-universal.zip.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Momok-macOS-universal
          path: |
            Momok-macOS-universal.zip
            Momok-macOS-universal.zip.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/momok-v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: false
          files: |
            Momok-macOS-universal.zip
            Momok-macOS-universal.zip.sha256
